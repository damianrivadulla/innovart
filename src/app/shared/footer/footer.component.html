<footer id="footer">
  <div class="wrapper wrapper--x-x-0">
    <app-line-reveal>
      <div class="line horizontal"></div>
    </app-line-reveal>
  </div>
  <div class="wrapper wrapper--m-top-25 wrapper--bottom-50 wrapper--m-bottom-75">
    <div class="max-w-1250 no-br">
      <app-paragraph-reveal classSelector="title-s">
        <p class="title-s mb-30" [innerHTML]="footerInfo?.contactPhrase"></p>

      </app-paragraph-reveal>
      <app-paragraph-reveal classSelector="title-s">
        <p class="title-s" [innerHTML]="footerInfo?.contactPhraseLink"></p>
      </app-paragraph-reveal>
    </div>
  </div>
  <div class="wrapper wrapper--x-x-0">
    <app-line-reveal>
      <div class="line horizontal"></div>
    </app-line-reveal>
  </div>
  <div

    <div class="x-hidden footer-col-1 gap-0">
      <div class="footer-col-1-content">
        <h4 _ngcontent-ng-c823299906="" class="text-s text-uppercase">SINCE 2003</h4>
        <p class="text"> {{ footerInfo?.whoWeAre }}</p>
      </div>
    </div>
    <div class="footer-col-2">
      <div class="footer-col-2-content-left">
        <div class="nav">
          <h4 class="text-s text-uppercase">SECTIONS</h4>
          <ul class="list">
            <ng-container *ngFor="let item of menuA">
              <li class="menu-item"><a class="link" [routerLink]="item.uri">{{ item.label }}</a></li>
            </ng-container>
          </ul>
        </div>
        <div class="nav">
          <h4 class="text-s text-uppercase">SOCIAL</h4>
          <ul class="list">
            <ng-container *ngFor="let item of footerInfo?.socialMedia">
              <li class="menu-item"><a class="link" href="{{ item.socialMediaItem.url }}" target="_blank">{{
                  item.socialMediaItem.title }}</a></li>
            </ng-container>
          </ul>
        </div>
        <div class="nav">
          <h4 class="text-s text-uppercase">RESOURCES</h4>
          <ul class="list">
            <ng-container *ngFor="let item of menuB">
              <li class="menu-item"><a class="link" [routerLink]="item.uri">{{ item.label }}</a></li>
            </ng-container>
          </ul>
        </div>
      </div>
      <div class="footer-col-2-content-right">
        <div class="text-s">
          <a class="link link--black back-to-top" (click)="scrollToTop()">BACK TO TOP</a>
        </div>
      </div>
    </div>
  </div>
