<footer id="footer">
  <div class="wrapper wrapper--x-x-0 footer-lead-line">
    <app-line-reveal>
      <div class="line horizontal"></div>
    </app-line-reveal>
  </div>
  <div class="wrapper wrapper--top-0 wrapper--m-top-25 wrapper--bottom-25 wrapper--m-bottom-75 footer-lead">
    <div class="max-w-1250 no-br">
      <app-paragraph-reveal classSelector="title-s">
        <div class="title-s mb-30" [innerHTML]="footerInfo?.contactPhrase"></div>

      </app-paragraph-reveal>
      <app-paragraph-reveal classSelector="title-s">
        <div class="title-s" [innerHTML]="footerInfo?.contactPhraseLink"></div>
      </app-paragraph-reveal>
    </div>
  </div>
  <div class="wrapper wrapper--x-x-0">
    <app-line-reveal>
      <div class="line horizontal"></div>
    </app-line-reveal>
  </div>
  <div class="wrapper wrapper--top-0 wrapper--bottom-25 footer-modules">
    <div class="footer-row footer-row-1">
      <div class="footer-left">
        <div class="footer-slogan">
          <p class="footer-slogan-text">{{ footerInfo?.whoWeAre }}</p>
        </div>
      </div>
      <div class="footer-right">
        <a class="link link--black back-to-top" (click)="scrollToTop()">BACK TO TOP</a>
      </div>
    </div>
    <div class="footer-row footer-row-2">
      <div class="footer-left">
        <p class="footer-legal">
          <span>innovart 2003 — {{ currentYear }}</span>
          <span>/</span>
          <span>{{ footerInfo?.copyright }}</span>
        </p>
      </div>
      <div class="footer-right">
        <div class="footer-navs">
          <div class="nav">
            <h4 class="footer-kicker text-uppercase">SECTIONS</h4>
            <ul class="list">
              <ng-container *ngFor="let item of menuA">
                <li class="menu-item"><a class="link" [routerLink]="item.uri">{{ item.label }}</a></li>
              </ng-container>
            </ul>
          </div>
          <div class="nav">
            <h4 class="footer-kicker text-uppercase">SOCIAL</h4>
            <ul class="list">
              <ng-container *ngFor="let item of footerInfo?.socialMedia">
                <li class="menu-item"><a class="link" href="{{ item.socialMediaItem.url }}" target="_blank">{{
                    item.socialMediaItem.title }}</a></li>
              </ng-container>
            </ul>
          </div>
          <div class="nav">
            <h4 class="footer-kicker text-uppercase">RESOURCES</h4>
            <ul class="list">
              <ng-container *ngFor="let item of menuB">
                <li class="menu-item"><a class="link" [routerLink]="item.uri">{{ item.label }}</a></li>
              </ng-container>
            </ul>
          </div>
        </div>
        <a href="{{ footerInfo?.bookCall.url }}" class="btn btn--icon btn--discovery">
          {{ footerInfo?.bookCall.title }} <svg id="Layer_2" xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 27.03 11.66">
            <path
              d="M0,5.4h25.56c-.65-.85-1.31-1.7-2.06-2.7l-2.06-2.7h1.2l4.4,5.83-4.4,5.83h-1.2l2.06-2.7c.74-.98,1.41-1.85,2.05-2.69H0v-.87Z"
              style="fill:#fff;" />
          </svg>
        </a>
      </div>
    </div>
  </div>
</footer>
