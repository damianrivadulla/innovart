<app-header></app-header>
<app-layout>
  <ng-container *ngIf="page">
    <div class="wrapper">
      <app-line-reveal>
        <div class="line horizontal"></div>
      </app-line-reveal>
    </div>
    <div class="wrapper wrapper--top-0 wrapper--bottom-30 wrapper--m-bottom-75">
      <div class="container container--sm">
        <app-paragraph-reveal classSelector="title">
          <h1 class="title text-uppercase">{{ page?.title }}</h1>
        </app-paragraph-reveal>
      </div>
    </div>
  </ng-container>
  <div class="wrapper wrapper--top-0 wrapper--bottom-60 wrapper--m-bottom-195 grid-m-34">
    <div class="col-left md-hidden"></div>
    <div class="col-right">
      <div class="container container--small">
        <div class="text">
          <p>Since 2003, we have partnered with our clients to build and differentiate their brands, whit a
            unique methodology distinctive approach defined by honesty, driven by insights, and focused on integrated brand
            strategy.</p>
        </div>
      </div>
    </div>
  </div>
</app-layout>
<app-footer></app-footer>
