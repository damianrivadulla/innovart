<app-header *ngIf="page"></app-header>
<app-layout *ngIf="page">
  <!-- Intro title + Story -->
  <div class="wrapper wrapper--x-gap-30 wrapper--m-top-0 wrapper--bottom-25 wrapper--m-bottom-75"
    *ngIf="page?.companyFields?.title || page?.companyFields?.story || page?.companyFields?.storyDescription">
    <app-paragraph-reveal classSelector="title" *ngIf="page?.companyFields?.title">
      <h1 class="title text-uppercase" [innerHTML]="page?.companyFields?.title"></h1>
    </app-paragraph-reveal>
    <div class="container container--small container--push-right"
      *ngIf="page?.companyFields?.story || page?.companyFields?.storyDescription">
      <div class="text text-uppercase company-story fw-light" *ngIf="page?.companyFields?.story"
        [innerHTML]="page?.companyFields?.story"></div>
      <div class="text fw-light" *ngIf="page?.companyFields?.storyDescription"
        [innerHTML]="page?.companyFields?.storyDescription"></div>
    </div>
  </div>

  <div class="wrapper wrapper--x-x-0" *ngIf="page?.companyFields?.values || page?.companyFields?.valuesItems?.length">
    <app-line-reveal>
      <div class="line horizontal"></div>
    </app-line-reveal>
  </div>

  <!-- Capabilities -->
  <div class="wrapper wrapper--x-gap-30 wrapper--top-0 wrapper--bottom-45 wrapper--m-bottom-75 company-capabilities"
    *ngIf="page?.companyFields?.values || page?.companyFields?.valuesItems?.length">
    <app-paragraph-reveal classSelector="title" *ngIf="page?.companyFields?.values">
      <h2 class="title text-uppercase" [innerHTML]="page?.companyFields?.values"></h2>
    </app-paragraph-reveal>
    <div class="container container--small container--push-right" *ngIf="page?.companyFields?.valuesItems?.length">
      <div class="capabilities-columns">
        <div class="capabilities-col">
          <div class="capability" *ngFor="let item of capabilitiesLeft">
            <h3 class="text text-uppercase">{{ item.subTitle }}</h3>
            <div class="capability-list text" [innerHTML]="item.subDescription"></div>
          </div>
        </div>
        <div class="capabilities-col">
          <div class="capability" *ngFor="let item of capabilitiesRight">
            <h3 class="text text-uppercase">{{ item.subTitle }}</h3>
            <div class="capability-list text" [innerHTML]="item.subDescription"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="wrapper wrapper--x-x-0" *ngIf="page?.companyFields?.process || page?.companyFields?.processDescription">
    <app-line-reveal>
      <div class="line horizontal"></div>
    </app-line-reveal>
  </div>

  <!-- Process -->
  <div class="wrapper wrapper--x-gap-30 wrapper--top-0 wrapper--bottom-45 wrapper--m-bottom-75"
    *ngIf="page?.companyFields?.process || page?.companyFields?.processDescription">
    <app-paragraph-reveal classSelector="title" *ngIf="page?.companyFields?.process">
      <h2 class="title text-uppercase" [innerHTML]="page?.companyFields?.process"></h2>
    </app-paragraph-reveal>
    <div class="container container--small container--push-right" *ngIf="page?.companyFields?.processDescription">
      <div class="text fw-light" [innerHTML]="page?.companyFields?.processDescription"></div>
    </div>
  </div>

  <div class="wrapper wrapper--x-x-0">
    <app-line-reveal>
      <div class="line horizontal"></div>
    </app-line-reveal>
  </div>

  <!-- Selected clients -->
  <div class="wrapper wrapper--x-gap-30 wrapper--top-0 wrapper--bottom-0"
    *ngIf="page?.companyFields?.clients || page?.companyFields?.clientsDescription">
    <app-paragraph-reveal classSelector="title" *ngIf="page?.companyFields?.clients">
      <h2 class="title text-uppercase" [innerHTML]="page?.companyFields?.clients"></h2>
    </app-paragraph-reveal>
    <div class="container container--small container--push-right" *ngIf="page?.companyFields?.clientsDescription">
      <div class="text fw-light" [innerHTML]="page?.companyFields?.clientsDescription"></div>
    </div>
  </div>
  <div class="wrapper wrapper-m--top-0 wrapper--m-bottom-195">
    <div class="logos">
      <ng-container *ngFor="let item of page.companyFields.clientsLogos.edges">
        <ng-container *ngIf="item?.node?.logos?.logo?.node?.sourceUrl as logoUrl">
          <a class="logo-img"
            *ngIf="item.node.logos.link; else logoOnly"
            [href]="item.node.logos.link"
            target="_blank"
            rel="noopener noreferrer">
            <img [src]="logoUrl" [alt]="item.node.logos.logo.node.altText || item.node.title"/>
          </a>
          <ng-template #logoOnly>
            <div class="logo-img">
              <img [src]="logoUrl" [alt]="item.node.logos.logo.node.altText || item.node.title"/>
            </div>
          </ng-template>
        </ng-container>
      </ng-container>
    </div>
  </div>

  <!-- Founders / leadership + team (dark band) -->
  <div class="company-founders">
    <div class="wrapper wrapper--top-75 wrapper--m-top-125 wrapper--bottom-30 wrapper--m-bottom-75"
      *ngIf="page?.companyFields?.leadership">
      <div class="container container--sm">
        <app-paragraph-reveal classSelector="title">
          <h2 class="title text-uppercase" [innerHTML]="page?.companyFields?.leadership"></h2>
        </app-paragraph-reveal>
      </div>
    </div>

    <div class="wrapper wrapper--top-0 wrapper--bottom-30 wrapper--m-bottom-75 grid-m-34"
      *ngIf="page?.companyFields?.leadershipDescription">
      <div class="col-left md-hidden"></div>
      <div class="col-right">
        <div class="container container--small">
          <div class="text" [innerHTML]="page?.companyFields?.leadershipDescription"></div>
        </div>
      </div>
    </div>

    <ng-container *ngFor="let item of page.companyFields.team.edges">
      <div class="wrapper">
        <app-line-reveal>
          <div class="line horizontal"></div>
        </app-line-reveal>
      </div>
      <div class="accordion wrapper wrapper--top-0 wrapper--bottom-0 grid-m-34" (click)="toggleAccordion($event)">
        <div class="col-left">
          <app-paragraph-reveal classSelector="title">
            <h3 class="title-s text-uppercase fw-light">{{ item.node.teamSingleFields.name }}</h3>
          </app-paragraph-reveal>
        </div>
        <div class="col-right">
          <div class="accordion-title">
            <h4 class="title-s text-grey fw-light">{{ item.node.teamSingleFields.title }}</h4>
            <div class="button button--plus"></div>
          </div>
        </div>
        <div class="col-left accordion-content-left md-hidden"></div>
        <div class="col-right accordion-content-left">
          <div class="accordion-content">
            <div class="text" [innerHTML]="item.node.teamSingleFields.description"></div>
          </div>
        </div>
      </div>
    </ng-container>

    <div class="wrapper wrapper--bottom-75 wrapper--m-bottom-195">
      <app-line-reveal>
        <div class="line horizontal"></div>
      </app-line-reveal>
    </div>
  </div>

  <!-- Testimonials -->
  <ng-container *ngIf="page?.companyFields?.testimonials?.edges?.length">
    <div class="wrapper wrapper--top-75 wrapper--m-top-125 wrapper--bottom-45 wrapper--m-bottom-75 grid-m-34 company-testimonials">
      <div class="col-left">
        <app-paragraph-reveal classSelector="title">
          <h2 class="title text-uppercase" [innerHTML]="page?.companyFields?.testimonialsLabel"></h2>
        </app-paragraph-reveal>
      </div>
      <div class="col-right">
        <app-gallery-text-horizontal [gallery]="page?.companyFields?.testimonials?.edges"></app-gallery-text-horizontal>
      </div>
    </div>
  </ng-container>
</app-layout>
<app-footer *ngIf="page"></app-footer>
