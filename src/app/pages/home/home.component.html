<app-header *ngIf="home"></app-header>
<app-layout *ngIf="home">
  <div class="wrapper wrapper--x-gap-45 wrapper--top-25 wrapper--bottom-45 wrapper-m--bottom-75">
    <app-paragraph-reveal classSelector="title-big">
      <h1 class="title title-big" [innerHTML]="home?.title"></h1>
    </app-paragraph-reveal>
    <div class="container container--small container--push-right">
      <p class="text">{{ home?.description }}</p>
    </div>
  </div>
  <div class="projects wrapper wrapper--top-30 wrapper-m--top-25 wrapper--m-bottom-75">
    <a href="{{ item?.node?.uri }}"
      class="project"
      *ngFor="let item of home?.selectedWork?.edges">
      <div class="featured">
        <div class="image-item" *ngIf="item?.node?.portfolioSingleFields?.portfolioImage?.node?.srcSet">
          <img class="img img--full" [srcset]="item?.node?.portfolioSingleFields.portfolioImage?.node?.srcSet"
            [alt]="item?.node?.portfolioSingleFields.portfolioImage?.node?.title">
        </div>
      </div>
      <div class="content">
        <div class="content-top">
          <div class="content-top-name">
            <h2 class="title-xs text-black">{{ item?.node?.portfolioSingleFields.name }}</h2>
          </div>
          <div class="content-top-voice-tone hidden" *ngIf="item?.node?.portfolioSingleFields?.voiceTone">
            <p class="text-s text-black">{{ item?.node?.portfolioSingleFields.voiceTone }}</p>
          </div>
        </div>
        <div class="content-bottom">
          <div class="content-bottom-location">
            <p class="text-s text-black">{{ item?.node?.portfolioSingleFields.location }}</p>
          </div>
        </div>
      </div>
    </a>
  </div>
  <ng-container *ngIf="home?.testimonials?.edges && home?.testimonials?.edges.length > 0">
    <div class="wrapper wrapper--x-x-0">
      <app-line-reveal>
        <div class="line horizontal"></div>
      </app-line-reveal>
    </div>
    <div class="wrapper wrapper--bottom-45 wrapper--m-bottom-75">
      <div class="work work--free">
        <div class="info">
          <h2 class="title title-s w-min text-uppercase" [innerHTML]="home?.testimonialsLabel"></h2>
        </div>
        <div class="gallery">
          <app-gallery-text-horizontal [gallery]="home?.testimonials?.edges"></app-gallery-text-horizontal>
        </div>
      </div>
    </div>
  </ng-container>
</app-layout>
<app-footer *ngIf="home"></app-footer>
